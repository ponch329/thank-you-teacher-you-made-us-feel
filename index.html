function processLogo(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 320;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        try {
          const data = ctx.getImageData(0, 0, w, h);
          const d = data.data;
          for (let i = 0; i < d.length; i += 4) {
            if (d[i] > 235 && d[i + 1] > 235 && d[i + 2] > 235) d[i + 3] = 0;
          }
          ctx.putImageData(data, 0, 0);
        } catch (err) {
        }
        resolve(canvas.toDataURL("image/png"));
      };
      img.onerror = () => reject(new Error("Could not read that image."));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("Could not read that file."));
    reader.readAsDataURL(file);
  });
}

const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Patrick+Hand&family=Caveat:wght@500;700&family=Gochi+Hand&family=Kalam:wght@400;700&family=Schoolbell&family=Shadows+Into+Light&family=Nunito:wght@400;600;700&display=swap');

* { box-sizing: border-box; }

.app {
  --ink: #2f2a26;
  --paper: #fbf9f3;
  --soft: #f3eee3;
  --yellow: #fbe6a0;
  --yellow-edge: #e9c969;
  --pink: #f3b9c6;
  --mint: #bfe3c9;
  --lav: #cdbceb;
  --sky: #bcdaee;
  --accent: #e07a9b;
  --accent-deep: #c75f82;
  font-family: 'Nunito', system-ui, sans-serif;
  color: var(--ink);
  background: linear-gradient(160deg, #fdfaf4, #f4eee2);
  min-height: 100vh;
}

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 14px;
  padding: 18px 22px;
  background: #fffdf8;
  border-bottom: 2px solid #efe6d3;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { font-size: 30px; }
.brand-title { font-family: 'Fredoka'; font-weight: 700; font-size: 21px; line-height: 1; }
.brand-sub { font-size: 13px; color: #8a8074; margin-top: 3px; }

.tabs { display: flex; gap: 6px; background: var(--soft); padding: 5px; border-radius: 14px; flex-wrap: wrap; }
.topbar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.admin-btn {
  font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 13px; cursor: pointer;
  border: 2px solid #e3d9c4; background: #fffdf8; color: #7d7264;
  padding: 8px 13px; border-radius: 999px; transition: all .15s; white-space: nowrap;
}
.admin-btn:hover { border-color: var(--accent); color: var(--accent-deep); }
.admin-btn.unlocked { background: #e7f4ea; border-color: #bfe0c9; color: #357a4c; }
.pin-modal { max-width: 320px; }
.tab {
  border: 0; background: transparent; cursor: pointer;
  font-family: 'Nunito'; font-weight: 700; font-size: 14px; color: #7d7264;
  padding: 9px 15px; border-radius: 10px; transition: all .15s;
  display: inline-flex; align-items: center; gap: 7px;
}
.tab.active { background: #fff; color: var(--accent-deep); box-shadow: 0 2px 6px rgba(0,0,0,.07); }
.count-pill {
  background: var(--accent); color: #fff; font-size: 12px; font-weight: 700;
  border-radius: 999px; min-width: 20px; height: 20px; padding: 0 6px;
  display: inline-flex; align-items: center; justify-content: center;
}

.wrap { max-width: 860px; margin: 0 auto; padding: 26px 18px 60px; }

.panel {
  background: #fffdf8; border: 2px solid #efe6d3; border-radius: 20px;
  padding: 26px; box-shadow: 0 8px 24px rgba(120,100,60,.08);
}
.panel-title { font-family: 'Fredoka'; font-weight: 700; font-size: 24px; margin: 0 0 4px; }
.panel-note { margin: 0 0 20px; color: #837a6c; font-size: 15px; line-height: 1.45; }

.field { margin-bottom: 18px; }
.label { display: block; font-weight: 700; font-size: 14px; margin-bottom: 7px; color: #4a4339; }
.label.small { font-size: 13px; color: #6a6052; }
.input {
  width: 100%; font-family: 'Nunito'; font-size: 16px; color: var(--ink);
  padding: 12px 14px; border: 2px solid #e3d9c4; border-radius: 12px;
  background: #fffefb; outline: none; transition: border-color .15s;
}
.input:focus { border-color: var(--accent); }

.drop {
  border: 2.5px dashed #d8cdb4; border-radius: 16px; background: #fffefb;
  min-height: 170px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; overflow: hidden; transition: border-color .15s, background .15s;
}
.drop:hover { border-color: var(--accent); background: #fffaf4; }
.drop.has-photo { border-style: solid; padding: 8px; }
.drop-hint { color: #9a8f7e; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 16px; }
.spinner {
  width: 28px; height: 28px; border-radius: 50%;
  border: 3px solid #e3d9c4; border-top-color: var(--accent);
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.drop-icon { font-size: 34px; }
.drop-preview { max-height: 220px; max-width: 100%; border-radius: 10px; object-fit: contain; }

.linkish {
  background: none; border: 0; color: var(--accent-deep); font-weight: 700;
  cursor: pointer; padding: 6px 0 0; font-size: 14px; font-family: 'Nunito';
}
.linkish:hover { text-decoration: underline; }

.toggle {
  background: none; border: 0; color: var(--accent-deep); font-weight: 700;
  cursor: pointer; font-size: 14px; font-family: 'Nunito'; padding: 0 0 4px;
}
.overrides { background: #faf5ea; border-radius: 14px; padding: 16px 16px 2px; margin: 8px 0 4px; }

.field-hint { font-size: 12.5px; color: #9a8f7e; margin: 6px 0 0; line-height: 1.4; }
.teacher-edit { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.teacher-edit .input { flex: 1; }
.logo-row { display: flex; gap: 16px; align-items: flex-start; }
.logo-preview {
  width: 96px; height: 76px; flex: none; border: 2px dashed #d8cdb4; border-radius: 12px;
  background: #fffefb; display: flex; align-items: center; justify-content: center;
  cursor: pointer; overflow: hidden; padding: 6px;
}
.logo-preview:hover { border-color: var(--accent); }
.logo-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
.logo-hint { font-size: 11px; color: #9a8f7e; font-weight: 600; text-align: center; }
.logo-actions { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.setup-actions { display: flex; gap: 10px; flex-wrap: wrap; }

.actions { margin-top: 22px; }
.btn {
  font-family: 'Fredoka'; font-weight: 600; font-size: 16px; cursor: pointer;
  border: 0; border-radius: 12px; padding: 12px 22px; transition: transform .1s, box-shadow .15s, background .15s;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent); color: #fff; box-shadow: 0 4px 12px rgba(224,122,155,.35); }
.btn-primary:hover { background: var(--accent-deep); }
.btn-primary:disabled { opacity: .6; cursor: default; }
.btn-ghost { background: #efe6d3; color: #6a6052; }
.btn-ghost:hover { background: #e6dac1; }
.btn-danger { background: #f6dede; color: #b3493f; font-size: 14px; padding: 9px 16px; }
.btn-danger:hover { background: #f0caca; }

.error { color: #b3493f; background: #fae3e0; border-radius: 10px; padding: 10px 14px; font-weight: 600; font-size: 14px; margin-top: 6px; }
.banner-ok { background: #e7f4ea; color: #357a4c; border-radius: 12px; padding: 12px 15px; font-size: 14px; margin-bottom: 20px; }
.banner-ok .linkish { padding: 0; }
.privacy { margin-top: 22px; font-size: 13px; color: #9a8f7e; line-height: 1.45; border-top: 1px dashed #e3d9c4; padding-top: 16px; }

.pages-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; margin-bottom: 22px; }
.teacher-chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  font-family: 'Fredoka'; font-weight: 600; font-size: 15px; cursor: pointer;
  border: 2px solid #e3d9c4; background: #fffdf8; color: #7d7264;
  padding: 9px 16px; border-radius: 999px; transition: all .15s;
}
.chip.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 3px 10px rgba(224,122,155,.3); }

.loading { text-align: center; color: #9a8f7e; padding: 60px 0; font-weight: 600; }

/* ---------- The thank-you sheet ---------- */
.page {
  background: #fcfbf6;
  background-image: radial-gradient(rgba(180,170,140,.06) 1px, transparent 1px);
  background-size: 9px 9px;
  border: 1px solid #e7ddc8;
  border-radius: 10px;
  width: 100%;
  max-width: 820px;
  margin: 0 auto;
  box-shadow: 0 10px 30px rgba(120,100,60,.14);
  aspect-ratio: 8.5 / 11;
  overflow: hidden;
}
.page-inner { position: relative; padding: 5% 6%; height: 100%; display: flex; flex-direction: column; }

.doodle { position: absolute; font-size: 26px; opacity: .92; pointer-events: none; }

.school-logo {
  position: absolute; top: 3.5%; right: 4.5%;
  height: clamp(34px, 6vw, 58px); width: auto;
  pointer-events: none; z-index: 2;
}

.banner-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 6px; }
.deco { font-size: 22px; }
.banner {
  font-family: 'Fredoka'; font-weight: 700; letter-spacing: .04em;
  font-size: clamp(11px, 2.1vw, 16px);
  background: var(--yellow); border: 2px solid var(--yellow-edge);
  color: #5b4a1f; padding: 4px 18px; border-radius: 6px;
  position: relative;
}
.banner::before, .banner::after {
  content: ""; position: absolute; top: 50%; width: 0; height: 0;
  border: 7px solid transparent;
}
.banner::before { left: -2px; transform: translate(-100%, -50%); border-right-color: var(--yellow); }
.banner::after { right: -2px; transform: translate(100%, -50%); border-left-color: var(--yellow); }

.thankyou { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 4px 0 2px; }
.ty-text { font-family: 'Fredoka'; font-weight: 700; font-size: clamp(26px, 6vw, 46px); letter-spacing: .01em; }
.ty-name {
  font-family: 'Patrick Hand', cursive; font-size: clamp(22px, 5vw, 40px);
  color: var(--accent-deep); flex: 1; min-width: 140px;
  border-bottom: 3px solid #2f2a26; padding: 0 6px 2px; line-height: 1.1;
}

.subhead {
  font-family: 'Fredoka'; font-weight: 600; font-size: clamp(12px, 2.4vw, 18px);
  letter-spacing: .01em; display: flex; align-items: center; gap: 8px; margin: 4px 0 14px;
}
.spark { font-size: 15px; }

.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4% 4%; align-content: start; }
.cell { display: flex; flex-direction: column; align-items: center; break-inside: avoid; }
.cell-name {
  font-family: var(--hand-font, 'Patrick Hand', cursive);
  font-size: calc(clamp(11px, 1.8vw, 15px) * var(--name-scale, 1));
  align-self: stretch; border-bottom: 1.5px solid #2f2a26; margin-bottom: 6px;
  text-align: center; padding: 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  line-height: 1.25;
}
.photo {
  position: relative;
  width: 100%; aspect-ratio: 4 / 3; border: 2px solid #2f2a26; border-radius: 4px;
  background: #fff; overflow: hidden;
}
.photo.editable { cursor: pointer; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; transform-origin: center; }
.adjust-badge {
  position: absolute; right: 4px; bottom: 4px;
  font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 10px;
  background: rgba(47,42,38,.78); color: #fff; padding: 2px 7px; border-radius: 999px;
  opacity: .85; pointer-events: none;
}
.photo.editable:hover .adjust-badge { opacity: 1; }
.oval {
  margin-top: -1px; width: 92%;
  border: 2px solid #2f2a26; border-radius: 50%;
  font-family: var(--hand-font, 'Patrick Hand', cursive);
  font-size: calc(clamp(11px, 1.8vw, 15px) * var(--adj-scale, 1));
  text-align: center; padding: 5px 4px; background: #fffefb;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ---------- Text style panel ---------- */
.text-panel {
  background: #fffdf8; border: 2px solid #efe6d3; border-radius: 16px;
  padding: 16px 18px; margin-bottom: 16px;
  display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 14px 20px; align-items: end;
}
.tp-row { display: flex; flex-direction: column; gap: 6px; }
.tp-row .label { margin-bottom: 0; }
.tp-val { color: var(--accent-deep); font-weight: 700; }
.select { padding: 10px 12px; }
.tp-footer {
  grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; font-size: 13px; color: #9a8f7e;
  border-top: 1px dashed #e3d9c4; padding-top: 12px;
}
.tp-footer .linkish { padding: 0; }

input[type="range"] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
  background: #e8ddc6; border-radius: 999px; outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 20px; height: 20px;
  border-radius: 50%; background: var(--accent); cursor: pointer; border: 2px solid #fff;
  box-shadow: 0 1px 4px rgba(0,0,0,.25);
}
input[type="range"]::-moz-range-thumb {
  width: 20px; height: 20px; border-radius: 50%; background: var(--accent);
  cursor: pointer; border: 2px solid #fff;
}

.bar-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.page-hint { text-align: center; color: #9a8f7e; font-size: 13px; font-weight: 600; margin: 0 0 12px; }

/* ---------- Photo editor modal ---------- */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(40,34,28,.55);
  display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50;
}
.modal {
  background: #fffdf8; border-radius: 20px; padding: 22px; width: 100%; max-width: 380px;
  box-shadow: 0 20px 50px rgba(0,0,0,.3);
}
.modal-title { font-family: 'Fredoka'; font-weight: 600; font-size: 19px; margin: 0 0 14px; }
.editor-frame {
  width: 100%; aspect-ratio: 4 / 3; border: 2px solid #2f2a26; border-radius: 6px;
  overflow: hidden; background: #fff; cursor: default; touch-action: none; user-select: none;
}
.editor-frame.draggable { cursor: grab; }
.editor-frame.draggable:active { cursor: grabbing; }
.editor-frame img { width: 100%; height: 100%; object-fit: cover; transform-origin: center; pointer-events: none; }
.editor-label { margin: 14px 0 6px; }
.editor-hint { font-size: 13px; color: #9a8f7e; margin: 10px 0 16px; }
.editor-actions { display: flex; gap: 8px; justify-content: flex-end; }

.empty {
  border: 2.5px dashed #d8cdb4; border-radius: 14px; padding: 30px 24px;
  text-align: center; color: #9a8f7e; font-weight: 600; line-height: 1.5; margin-top: 10px;
}
.empty.light { border: none; padding: 30px 0; }

/* ---------- Manage ---------- */
.manage-list { list-style: none; margin: 0; padding: 0; }
.manage-row { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid #efe6d3; }
.manage-photo { width: 56px; height: 44px; border: 2px solid #2f2a26; border-radius: 4px; overflow: hidden; flex: none; background: #fff; }
.manage-photo img { width: 100%; height: 100%; object-fit: cover; }
.manage-info { flex: 1; min-width: 0; }
.manage-name { font-family: 'Fredoka'; font-weight: 600; font-size: 17px; }
.manage-words { font-size: 13px; color: #8a8074; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reset-zone { margin-top: 22px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 14px; color: #837a6c; }
.backup-zone { margin-top: 22px; border-top: 1px dashed #e3d9c4; padding-top: 18px; }
.backup-title { font-family: 'Fredoka'; font-weight: 600; font-size: 16px; margin: 0 0 4px; }
.backup-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }

@media (max-width: 560px) {
  .grid { grid-template-columns: repeat(2, 1fr); gap: 5% 5%; }
  .text-panel { grid-template-columns: 1fr; }
}

/* ---------- Print ---------- */
@media print {
  @page { size: letter portrait; margin: 0.4in; }
  .app { background: #fff; }
  .page { box-shadow: none; border: none; max-width: 100%; aspect-ratio: auto; }
  .grid { grid-template-columns: repeat(4, 1fr); }
  .doodle { opacity: 1; }
}
